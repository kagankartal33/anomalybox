sonar.projectKey=anomaly-box
sonar.projectName=ViralBox
sonar.sourceEncoding=UTF-8

# Source folders
sonar.sources=app,components,lib

# Test folders and patterns
sonar.tests=tests,tools
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx,tests/**/*.test.js,tests/**/*.test.mjs,tests/**/test_*.py,tools/test-*.mjs,tools/test-*.ts

# Exclusions
sonar.exclusions=**/*.d.ts,**/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.gif,**/*.svg,**/*.ico,**/*.mp4,**/.next/**,**/node_modules/**,public/**,archive/**,production_exports/**,site-html-export/**,dataset/**,quantum/data/**,artifacts/**,.agent/**,.claude/**,.gemini/**,**/__pycache__/**
sonar.coverage.exclusions=app/**/page.tsx,app/**/layout.tsx,app/**/route.ts,components/**,tests/**,tools/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

